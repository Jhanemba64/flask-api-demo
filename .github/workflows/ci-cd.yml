name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1) Tests d'intégration ----------------------------------------------------
  test:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lancer pytest
        run: pytest -v

  # 2) Build de l'image Docker + publication sur GHCR -------------------------
  build-and-push:
    name: Build & push GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées de l'image (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 3) Provisioning / déploiement sur Render via Terraform --------------------
  deploy:
    name: Provisioning Render (Terraform)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
      TF_VAR_ghcr_username: ${{ github.repository_owner }}
      TF_VAR_ghcr_token: ${{ secrets.GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les variables Terraform (image GHCR de ce commit)
        run: |
          echo "TF_VAR_image_url=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Persiste le tfstate entre les runs (le runner éphémère le perd sinon).
      # Sans état, Terraform retenterait de CRÉER des ressources déjà existantes (erreur 400).
      - name: Restaurer / sauvegarder l'état Terraform
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate
          key: tfstate-${{ github.run_id }}
          restore-keys: |
            tfstate-

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      # Amorçage one-shot : rattache au state les ressources déjà créées sur Render
      # si elles n'y figurent pas (premier run, ou cache évincé). Auto-réparant.
      # Supprimable une fois le state stabilisé dans le cache.
      - name: Importer l'existant si absent du state
        run: |
          terraform state show render_registry_credential.ghcr >/dev/null 2>&1 \
            || terraform import -input=false render_registry_credential.ghcr rgc-d8tq8vernols73bclg10
          terraform state show render_web_service.api >/dev/null 2>&1 \
            || terraform import -input=false render_web_service.api srv-d8tq8vrtqb8s73elh4bg

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -no-color

      # Déploie l'image de ce commit via l'API Render (le service est déjà
      # provisionné par Terraform ; on évite ainsi l'update Terraform interdit en free).
      - name: Déclencher le deploy de la nouvelle image sur Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SID=$(terraform output -raw service_id)
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "Deploy de $IMG sur le service $SID"
          code=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/${SID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\":\"${IMG}\"}")
          echo "HTTP ${code}"; cat /tmp/deploy.json; echo
          case "$code" in 200|201|202) echo "Deploy déclenché.";; *) echo "Échec du déclenchement"; exit 1;; esac
